<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOTREX PRO</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#080808;color:#fff;display:flex;justify-content:center;padding:20px}.box{width:100%;max-width:420px;background:#141414;border:1px solid #222;border-radius:20px;padding:20px}h1{text-align:center;color:#ff1a1a;letter-spacing:3px}input{width:100%;background:#1e1e1e;border:1px solid #333;padding:12px;border-radius:10px;color:#fff;margin:10px 0}.btn{width:100%;background:#ff1a1a;border:none;padding:12px;border-radius:10px;color:#fff;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.gbtn{background:#1e1e1e;border:1px solid #333;padding:14px;border-radius:10px;color:#fff;font-weight:bold}.gbtn.perm{grid-column:span 2;background:#ff1a1a}.keyBox{display:none;background:#000;border:1px dashed #ff1a1a;border-radius:10px;padding:12px;text-align:center;margin:10px 0}.key{color:#00ff88;font-weight:bold;font-size:18px;margin:8px 0;word-break:break-all}.item{background:#1c1c1c;padding:10px;border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;font-size:12px}.hidden{display:none}</style></head><body><div class="box"><h1>VOTREX PRO</h1><div id="login"><input id="pass" type="password" placeholder="Password Admin (votrex123)"><button class="btn" onclick="login()">LOGIN</button></div><div id="main" class="hidden"><div class="grid"><button class="gbtn" onclick="gen('1H')">1H</button><button class="gbtn" onclick="gen('2H')">2H</button><button class="gbtn" onclick="gen('3H')">3H</button><button class="gbtn" onclick="gen('4H')">4H</button><button class="gbtn" onclick="gen('20H')">20H</button><button class="gbtn perm" onclick="gen('PERM')">PERMANENT</button></div><div id="keyBox" class="keyBox"><div id="keyRes" class="key">-</div><button onclick="copyK()" style="background:#00ff88;border:none;padding:6px 12px;border-radius:6px;font-weight:bold">COPY</button></div><div id="list"></div></div></div><script>let keys=JSON.parse(localStorage.getItem('vk')||'[]');let cur='';function login(){if(pass.value=='votrex123'){loginEl=document.getElementById('login');loginEl.classList.add('hidden');main.classList.remove('hidden');render()}else alert('salah')}function rand(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';let r='';for(let i=0;i<4;i++)r+=c[Math.floor(Math.random()*c.length)];return r}function gen(t){const code='VOTREX-'+rand()+'-'+t;keys.unshift({k:code,t:t,s:'ACTIVE'});localStorage.setItem('vk',JSON.stringify(keys));cur=code;keyRes.innerText=code;keyBox.style.display='block';render()}function copyK(){navigator.clipboard.writeText(cur);alert('Copied '+cur)}function render(){list.innerHTML='';keys.filter(x=>x.s!='USED').forEach(x=>{list.innerHTML+=`<div class=item><b>${x.k}</b><span style=color:#00ff88>${x.t}</span></div>`})}</script></body></html>
